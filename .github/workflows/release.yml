# NOTE: All third-party actions are pinned by full commit SHA for supply-chain safety.
# To update an action: find the new version's commit SHA on GitHub (Tags → verify commit),
# replace the SHA, and keep the "# vX" comment in sync.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build-and-release:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 20)

          echo -n "$CERTIFICATE_P12" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}
          echo "Setting version to $VERSION ($BUILD_NUMBER)"
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = $VERSION;/" Pine.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" Pine.xcodeproj/project.pbxproj

      - name: Build archive
        run: |
          xcodebuild archive \
            -skipPackagePluginValidation \
            -project Pine.xcodeproj \
            -scheme Pine \
            -archivePath $RUNNER_TEMP/Pine.xcarchive \
            -destination "generic/platform=macOS" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=YES

      - name: Export app
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Pine.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Pine.app" "$RUNNER_TEMP/Pine.zip"

          xcrun notarytool submit "$RUNNER_TEMP/Pine.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait | tee /tmp/notarytool-output.txt

          SUBMISSION_ID=$(grep -o '[0-9a-f\-]\{36\}' /tmp/notarytool-output.txt | head -1)
          if grep -q "Invalid" /tmp/notarytool-output.txt; then
            echo "Notarization failed, fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

          xcrun stapler staple "$RUNNER_TEMP/export/Pine.app"

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create branded DMG
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          bash scripts/create-dmg.sh \
            "$RUNNER_TEMP/export/Pine.app" \
            "$RUNNER_TEMP/Pine-${VERSION}.dmg"

      - name: Verify branded DMG
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          bash scripts/verify-dmg.sh \
            "$RUNNER_TEMP/Pine-${VERSION}.dmg" \
            "$VERSION"

      - name: Download Sparkle tools
        run: |
          SPARKLE_VERSION="2.9.0"
          curl -L -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

      - name: Sign DMG with EdDSA
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set"
            exit 1
          fi
          VERSION=${{ steps.version.outputs.VERSION }}
          SIGN_OUTPUT=$("$RUNNER_TEMP/sparkle/bin/sign_update" "$RUNNER_TEMP/Pine-${VERSION}.dmg" --ed-key-file <(echo "$SPARKLE_PRIVATE_KEY"))
          echo "SPARKLE_SIGNATURE=$SIGN_OUTPUT" >> $GITHUB_ENV

      - name: Generate release notes HTML
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          python3 .github/scripts/changelog_to_html.py "$VERSION" > "$RUNNER_TEMP/release-notes.html"

      - name: Generate appcast.xml
        env:
          APPCAST_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S %z")
          # Extract edSignature and length from sign_update output
          ED_SIGNATURE=$(echo "$SPARKLE_SIGNATURE" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          LENGTH=$(echo "$SPARKLE_SIGNATURE" | sed -n 's/.*length="\([^"]*\)".*/\1/p')

          APPCAST_VERSION="$VERSION" \
          APPCAST_PUB_DATE="$PUB_DATE" \
          APPCAST_ED_SIGNATURE="$ED_SIGNATURE" \
          APPCAST_LENGTH="$LENGTH" \
          APPCAST_NOTES_FILE="$RUNNER_TEMP/release-notes.html" \
          python3 -c '
          import os
          from pathlib import Path

          notes = Path(os.environ["APPCAST_NOTES_FILE"]).read_text()
          version = os.environ["APPCAST_VERSION"]

          print(f"""<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Pine</title>
              <item>
                <title>Version {version}</title>
                <pubDate>{os.environ["APPCAST_PUB_DATE"]}</pubDate>
                <sparkle:version>{os.environ["APPCAST_BUILD_NUMBER"]}</sparkle:version>
                <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <description><![CDATA[{notes}]]></description>
                <enclosure url="https://github.com/batonogov/pine/releases/download/v{version}/Pine-{version}.dmg"
                  sparkle:edSignature="{os.environ["APPCAST_ED_SIGNATURE"]}"
                  length="{os.environ["APPCAST_LENGTH"]}"
                  type="application/octet-stream" />
              </item>
            </channel>
          </rss>""")
          ' > "$RUNNER_TEMP/appcast.xml"

      - name: Validate appcast.xml
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          DMG_FILENAME="Pine-${VERSION}.dmg"
          EXPECTED_URL="https://github.com/batonogov/pine/releases/download/v${VERSION}/${DMG_FILENAME}"
          ACTUAL_URL=$(sed -n 's/.*enclosure url="\([^"]*\)".*/\1/p' "$RUNNER_TEMP/appcast.xml" | tr -d ' ')
          if [ "$ACTUAL_URL" != "$EXPECTED_URL" ]; then
            echo "::error::Appcast DMG URL mismatch"
            echo "  Expected: $EXPECTED_URL"
            echo "  Actual:   $ACTUAL_URL"
            exit 1
          fi
          if [ ! -f "$RUNNER_TEMP/$DMG_FILENAME" ]; then
            echo "::error::DMG file not found: $DMG_FILENAME"
            exit 1
          fi
          echo "Appcast URL and DMG file validated successfully"

      - name: Download previous signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASES_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          PREVIOUS_TAG=$(printf '%s' "$RELEASES_JSON" \
            | python3 .github/scripts/select_previous_release.py \
                "$GITHUB_REF_NAME")
          PREVIOUS_VERSION=${PREVIOUS_TAG#v}
          PREVIOUS_FILENAME="Pine-${PREVIOUS_VERSION}.dmg"

          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download "$PREVIOUS_TAG" \
            --pattern "$PREVIOUS_FILENAME" \
            --dir "$RUNNER_TEMP/previous-release"

          PREVIOUS_DMG="$RUNNER_TEMP/previous-release/$PREVIOUS_FILENAME"
          if [ ! -f "$PREVIOUS_DMG" ]; then
            echo "::error::Previous Pine DMG download is missing"
            exit 1
          fi
          echo "PREVIOUS_DMG=$PREVIOUS_DMG" >> "$GITHUB_ENV"
          echo "Previous signed release: $PREVIOUS_TAG"

      - name: Record candidate DMG hash before publication
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p "$RUNNER_TEMP/publication-metadata"
          shasum -a 256 "$RUNNER_TEMP/Pine-${VERSION}.dmg" \
            | tee "$RUNNER_TEMP/publication-metadata/candidate-before-publication.sha256"

      - name: Run signed release artifact smoke
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          bash scripts/release-artifact-smoke.sh \
            "$RUNNER_TEMP/Pine-${VERSION}.dmg" \
            "$PREVIOUS_DMG" \
            "$VERSION" \
            "$GITHUB_RUN_NUMBER" \
            "$RUNNER_TEMP/appcast.xml" \
            "$RUNNER_TEMP/SourcePackages/checkouts/Sparkle" \
            "$RUNNER_TEMP/release-smoke"

      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$RUNNER_TEMP/Pine-${VERSION}.dmg" \
              "$RUNNER_TEMP/appcast.xml"
          else
            gh release create "$GITHUB_REF_NAME" \
              "$RUNNER_TEMP/Pine-${VERSION}.dmg" \
              "$RUNNER_TEMP/appcast.xml" \
              --title "Pine ${VERSION}" \
              --generate-notes
          fi

      - name: Verify published DMG matches tested bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p "$RUNNER_TEMP/published-release"
          gh release download "$GITHUB_REF_NAME" \
            --pattern "Pine-${VERSION}.dmg" \
            --dir "$RUNNER_TEMP/published-release"

          PUBLISHED_DMG="$RUNNER_TEMP/published-release/Pine-${VERSION}.dmg"
          shasum -a 256 "$PUBLISHED_DMG" \
            | tee "$RUNNER_TEMP/publication-metadata/candidate-after-publication.sha256"
          TESTED_SHA=$(awk '{print $1}' \
            "$RUNNER_TEMP/publication-metadata/candidate-before-publication.sha256")
          PUBLISHED_SHA=$(awk '{print $1}' \
            "$RUNNER_TEMP/publication-metadata/candidate-after-publication.sha256")
          if [ "$PUBLISHED_SHA" != "$TESTED_SHA" ]; then
            echo "::error::Published DMG differs from the tested candidate"
            exit 1
          fi

      - name: Upload release smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-smoke-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-smoke/logs
            ${{ runner.temp }}/release-smoke/ReleaseArtifactSmoke.xcresult
            ${{ runner.temp }}/release-smoke/metadata/appcast.json
            ${{ runner.temp }}/release-smoke/metadata/release-smoke.txt
            ${{ runner.temp }}/release-smoke/metadata/toolchain.txt
            ${{ runner.temp }}/release-smoke/metadata/candidate-before-smoke.sha256
            ${{ runner.temp }}/release-smoke/metadata/candidate-after-smoke.sha256
            ${{ runner.temp }}/publication-metadata
          if-no-files-found: warn
          retention-days: 14

      - name: Update Homebrew Tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          SHA256=$(shasum -a 256 "$RUNNER_TEMP/Pine-${VERSION}.dmg" | awk '{print $1}')

          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/batonogov/homebrew-tap.git $RUNNER_TEMP/homebrew-tap
          cd $RUNNER_TEMP/homebrew-tap
          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/pine-editor.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"$SHA256\"/" Casks/pine-editor.rb
          sed -i '' "s|Pine.dmg|Pine-#{version}.dmg|" Casks/pine-editor.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/pine-editor.rb
          git commit -m "Update Pine to $VERSION"
          git push

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
