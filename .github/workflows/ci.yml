# NOTE: All third-party actions are pinned by full commit SHA for supply-chain safety.
# To update an action: find the new version's commit SHA on GitHub (Tags → verify commit),
# replace the SHA, and keep the "# vX" comment in sync.
name: CI

on:
  pull_request:
    branches: [main]
    # `labeled` lets the `perf` / `fuzz` labels trigger opt-in jobs
    # on-demand from a PR without re-running the rest of CI.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_performance_tests:
        description: "Run PinePerformanceTests benchmark suite"
        type: boolean
        default: true

# Cancel superseded runs on PRs to reclaim ~27 min of macOS-26 runner time
# per push. Main-branch pushes and manual dispatches use a dedicated group
# with `cancel-in-progress: false` so required main-branch runs are never
# cancelled mid-run (they queue instead). See issue #999.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SWIFTLINT_VERSION: "0.63.2"
      SWIFTLINT_SHA256: "dd1017cfd20a1457f264590bcb5875a6ee06cd75b9a9d4f77cd43a552499143b"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install SwiftLint
        run: |
          curl -fSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" -o swiftlint.zip
          echo "${SWIFTLINT_SHA256}  swiftlint.zip" | sha256sum -c -
          unzip -o swiftlint.zip
          chmod +x swiftlint
          sudo mv swiftlint /usr/local/bin/

      - name: Run SwiftLint
        run: swiftlint --strict

      - name: Check nonisolated on background-queue types (issues #693/#699)
        run: python3 .github/scripts/check_nonisolated.py Pine

      - name: Unit tests for nonisolated check script
        working-directory: .github/scripts
        run: python3 -m unittest test_check_nonisolated.py -v

      - name: Check no NotificationCenter post under inout (exclusivity-abort reentrancy, #1066)
        run: python3 scripts/check-no-post-under-inout.py Pine

      - name: Tests for inout-post reentrancy guard
        run: bash scripts/tests/test-check-no-post-under-inout.sh

      - name: Tests for Metal toolchain installer
        run: bash scripts/tests/test-ensure-metal-toolchain.sh

      - name: Tests for unit-test result validation
        run: bash scripts/tests/test-validate-test-results.sh

      - name: Tests for xcodebuild CLI options
        run: bash scripts/tests/test-xcodebuild-cli-options.sh

  build:
    name: Build for Testing
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Ensure Metal Toolchain
        run: bash scripts/ensure-metal-toolchain.sh

      - name: Cache SPM Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Pine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build App
        run: |
          xcodebuild build \
            -project Pine.xcodeproj \
            -scheme Pine \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project Pine.xcodeproj \
            -scheme Pine \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO

      - name: Smoke Test — Verify App Bundle
        run: |
          APP_PATH=$(find DerivedData/Build/Products -name "Pine.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Pine.app not found in build products"
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          # Verify the app bundle structure and binary is executable
          BINARY="$APP_PATH/Contents/MacOS/Pine"
          if [ ! -x "$BINARY" ]; then
            echo "::error::Pine binary not found or not executable at: $BINARY"
            exit 1
          fi
          echo "Binary is executable: $BINARY"

          # Verify Info.plist exists
          if [ ! -f "$APP_PATH/Contents/Info.plist" ]; then
            echo "::error::Info.plist not found in app bundle"
            exit 1
          fi
          echo "Info.plist present"

          # Verify binary is a valid Mach-O executable
          file "$BINARY" | grep -q "Mach-O" || { echo "::error::Binary is not a valid Mach-O executable"; exit 1; }
          echo "Binary is valid Mach-O"

          echo "Smoke test passed"

      - name: Archive Build Products
        run: |
          tar --zstd -cf build-products.tar.zst --exclude='DerivedData/ModuleCache' DerivedData
          sha256sum build-products.tar.zst > build-products.sha256

      - name: Upload Build Products
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-products
          path: |
            build-products.tar.zst
            build-products.sha256
          retention-days: 1
          compression-level: 0

  # Compiler/SDK compatibility lane for the Xcode 27 preview image. The
  # hosted runner still uses macOS 26, so runtime coverage on macOS 27 must
  # continue on real hardware. Keep this non-blocking while the image is in
  # preview; failures should remain visible without becoming required checks.
  xcode-27-compatibility:
    name: Xcode 27 Preview Compatibility
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Do not use the stable select-xcode helper here: xcode-27 runners
      # provide the preview Xcode/SDK pair as their active toolchain.
      - name: Report Preview Environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK version: $sdk_version"
          echo "macOS SDK build: $(xcrun --sdk macosx --show-sdk-build-version)"
          echo "macOS SDK path: $(xcrun --sdk macosx --show-sdk-path)"

          case "$xcode_version" in
            27|27.*) ;;
            *)
              echo "::error::The xcode-27 lane resolved Xcode $xcode_version"
              exit 1
              ;;
          esac

          case "$sdk_version" in
            27|27.*) ;;
            *)
              echo "::error::The xcode-27 lane resolved macOS SDK $sdk_version"
              exit 1
              ;;
          esac

      - name: Ensure Metal Toolchain
        run: bash scripts/ensure-metal-toolchain.sh

      - name: Cache SPM Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: DerivedData-Xcode27/SourcePackages
          key: spm-xcode-27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Pine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-xcode-27-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify macOS 26 Deployment Target
        run: |
          for configuration in Debug Release; do
            settings="$(
              xcodebuild \
                -project Pine.xcodeproj \
                -alltargets \
                -configuration "$configuration" \
                -showBuildSettings \
                -json
            )"
            target_count="$(jq 'length' <<<"$settings")"
            if [ "$target_count" -eq 0 ]; then
              echo "::error::No targets resolved for $configuration"
              exit 1
            fi

            invalid="$(
              jq -r '
                .[]
                | select(.buildSettings.MACOSX_DEPLOYMENT_TARGET != "26.0")
                | "\(.target)=\(.buildSettings.MACOSX_DEPLOYMENT_TARGET // "missing")"
              ' <<<"$settings"
            )"
            if [ -n "$invalid" ]; then
              echo "::error::Expected MACOSX_DEPLOYMENT_TARGET=26.0 for every $configuration target"
              echo "$invalid"
              exit 1
            fi

            echo "Verified $target_count $configuration target settings at MACOSX_DEPLOYMENT_TARGET=26.0"
          done

      - name: Build App with Xcode 27
        run: |
          xcodebuild build \
            -project Pine.xcodeproj \
            -scheme Pine \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData-Xcode27 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Unit Tests with Xcode 27
        run: |
          RESULT_BUNDLE="Xcode27TestResults.xcresult"
          rm -rf "$RESULT_BUNDLE"
          TEST_STARTED_AT="$(date +%s)"

          set +e
          xcodebuild test \
            -project Pine.xcodeproj \
            -scheme Pine \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData-Xcode27 \
            -only-testing:PineTests \
            -skip-testing:PineTests/FuzzGitDiffParserTests \
            -skip-testing:PineTests/FuzzGitBlameParserTests \
            -skip-testing:PineTests/FuzzGitStatusParserTests \
            -skip-testing:PineTests/FuzzSyntaxHighlighterTests \
            -skip-testing:PineTests/FuzzQuickOpenProviderTests \
            -skip-testing:PineTests/FuzzSymbolParserTests \
            -skip-testing:PineTests/FuzzConfigValidatorTests \
            -skip-testing:PineTests/FuzzGoToLineParserTests \
            -retry-tests-on-failure \
            -test-timeouts-enabled YES \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          TEST_EXIT=$?
          set -e

          python3 .github/scripts/validate_test_results.py \
            "$RESULT_BUNDLE" \
            --xcodebuild-exit "$TEST_EXIT" \
            --started-at "$TEST_STARTED_AT" \
            --github-summary

  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    needs: build
    # Bumped from 45 → 60 min as a safety net. The per-test timeout
    # (-test-timeouts-enabled below) is the primary mitigation for the
    # macos-26 fork/spawn hang (#1060): a stuck test is now killed in
    # seconds rather than burning the whole job budget. This extra headroom
    # covers legitimate slow-but-passing tests on a noisy shared runner.
    timeout-minutes: 60
    env:
      COVERAGE_THRESHOLD: 70
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Download Build Products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-products

      - name: Extract Build Products
        run: |
          sha256sum -c build-products.sha256
          tar --zstd -xf build-products.tar.zst

      # Fuzz tests are excluded from the blocking CI pipeline because they
      # generate random input data and occasionally hit pathological cases
      # (large strings, regex backtracking) that exceed the 60s time limit.
      # They run in a separate nightly job (.github/workflows/nightly-fuzz.yml)
      # and can be triggered on-demand via the `fuzz` label on a PR.
      - name: Unit Tests
        run: |
          RESULT_BUNDLE="TestResults.xcresult"
          rm -rf "$RESULT_BUNDLE"
          TEST_STARTED_AT="$(date +%s)"

          set +e
          xcodebuild test-without-building \
            -project Pine.xcodeproj \
            -scheme Pine \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -only-testing:PineTests \
            -skip-testing:PineTests/FuzzGitDiffParserTests \
            -skip-testing:PineTests/FuzzGitBlameParserTests \
            -skip-testing:PineTests/FuzzGitStatusParserTests \
            -skip-testing:PineTests/FuzzSyntaxHighlighterTests \
            -skip-testing:PineTests/FuzzQuickOpenProviderTests \
            -skip-testing:PineTests/FuzzSymbolParserTests \
            -skip-testing:PineTests/FuzzConfigValidatorTests \
            -skip-testing:PineTests/FuzzGoToLineParserTests \
            -retry-tests-on-failure \
            -test-timeouts-enabled YES \
            -enableCodeCoverage YES \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO
          TEST_EXIT=$?
          set -e

          python3 .github/scripts/validate_test_results.py \
            "$RESULT_BUNDLE" \
            --xcodebuild-exit "$TEST_EXIT" \
            --started-at "$TEST_STARTED_AT" \
            --github-summary

      - name: Detect Flaky Tests
        if: success() || failure()
        id: flaky
        run: |
          python3 .github/scripts/detect_flaky_tests.py \
            TestResults.xcresult --github-summary

      - name: Extract Coverage Report
        if: success() || failure()
        id: coverage
        continue-on-error: true
        run: |
          XCRESULT="TestResults.xcresult"
          if [ ! -d "$XCRESULT" ]; then
            echo "No .xcresult bundle found"
            exit 0
          fi

          # Get JSON coverage report
          # On macos-26 / Xcode 26 RC runners, xccov sometimes fails with
          # "No coverage data in result bundle" even when tests pass (#1060).
          # Coverage is informational — never block the PR on this.
          if ! xcrun xccov view --report --json "$XCRESULT" > coverage.json 2>/dev/null; then
            echo "::warning::Could not extract coverage data from result bundle — skipping coverage check"
            exit 0
          fi

          # Extract coverage for Pine target, excluding pure SwiftUI view files
          # (views are covered by UI tests separately)
          COVERAGE=$(python3 -c "
          import json, sys
          EXCLUDED_VIEWS = {
              'AccessibilityIdentifiers.swift',
              'BranchSubtitleClickHandler.swift',
              'BranchSwitcherView.swift',
              'CodeEditorView.swift',
              'ContentView.swift',
              'ContentView+Helpers.swift',
              'PaneLeafView.swift',
              'EditorTabBar.swift',
              'FileNodeRow.swift',
              'GitAndNotificationObserver.swift',
              'MarkdownPreviewView.swift',
              'QuickLookPreviewView.swift',
              'QuickOpenView.swift',
              'RecoveryDialogView.swift',
              'RepresentedFileTracker.swift',
              'SearchResultsView.swift',
              'SidebarView.swift',
              'SidebarFileTree.swift',
              'StatusBarView.swift',
              'PaneTreeView.swift',
              'TerminalBarView.swift',
              'TerminalPaneContent.swift',
              'TerminalPaneTabBar.swift',
              'TerminalSearchBar.swift',
              'WelcomeView.swift',
          }
          with open('coverage.json') as f:
              data = json.load(f)
          for target in data.get('targets', []):
              if target['name'] == 'Pine.app':
                  covered = 0
                  total = 0
                  for f in target.get('files', []):
                      if f['name'] in EXCLUDED_VIEWS:
                          continue
                      covered += f.get('coveredLines', 0)
                      total += f.get('executableLines', 0)
                  pct = (covered / total * 100) if total > 0 else 0
                  print(f'{pct:.1f}')
                  sys.exit(0)
          print('0.0')
          ")

          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "## Code Coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"

          # Generate per-file breakdown for top/bottom files
          python3 -c "
          import json
          EXCLUDED_VIEWS = {
              'AccessibilityIdentifiers.swift',
              'BranchSubtitleClickHandler.swift',
              'BranchSwitcherView.swift',
              'CodeEditorView.swift',
              'ContentView.swift',
              'ContentView+Helpers.swift',
              'PaneLeafView.swift',
              'EditorTabBar.swift',
              'FileNodeRow.swift',
              'GitAndNotificationObserver.swift',
              'MarkdownPreviewView.swift',
              'QuickLookPreviewView.swift',
              'QuickOpenView.swift',
              'RecoveryDialogView.swift',
              'RepresentedFileTracker.swift',
              'PaneTreeView.swift',
              'SearchResultsView.swift',
              'SidebarView.swift',
              'SidebarFileTree.swift',
              'StatusBarView.swift',
              'TerminalBarView.swift',
              'TerminalPaneContent.swift',
              'TerminalPaneTabBar.swift',
              'TerminalSearchBar.swift',
              'WelcomeView.swift',
          }
          with open('coverage.json') as f:
              data = json.load(f)
          for target in data.get('targets', []):
              if target['name'] != 'Pine.app':
                  continue
              files = []
              excluded = []
              for f in target.get('files', []):
                  name = f['name']
                  pct = f['lineCoverage'] * 100
                  entry = (name, pct, f.get('coveredLines', 0), f.get('executableLines', 0))
                  if name in EXCLUDED_VIEWS:
                      excluded.append(entry)
                  else:
                      files.append(entry)
              files.sort(key=lambda x: x[1])

              print('### Lowest Coverage Files (logic only)')
              print('| File | Coverage | Lines |')
              print('|------|----------|-------|')
              for name, pct, covered, total in files[:10]:
                  if total > 0:
                      print(f'| {name} | {pct:.1f}% | {covered}/{total} |')

              print()
              print('### Highest Coverage Files')
              print('| File | Coverage | Lines |')
              print('|------|----------|-------|')
              for name, pct, covered, total in files[-10:]:
                  if total > 0:
                      print(f'| {name} | {pct:.1f}% | {covered}/{total} |')

              if excluded:
                  excluded_lines = sum(t for _, _, _, t in excluded)
                  print()
                  print(f'_Excluded from threshold: {len(excluded)} pure SwiftUI view files ({excluded_lines} lines) — covered by UI tests._')
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Check Coverage Threshold
        if: (success() || failure()) && steps.coverage.outputs.coverage != ''
        run: |
          COVERAGE="${{ steps.coverage.outputs.coverage }}"
          THRESHOLD="${{ env.COVERAGE_THRESHOLD }}"
          echo "Coverage: ${COVERAGE}%, threshold: ${THRESHOLD}%"
          if python3 -c "exit(0 if float('$COVERAGE') >= float('$THRESHOLD') else 1)"; then
            echo "✅ Coverage is above threshold"
          else
            echo "::error::Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi

      - name: Comment Coverage on PR
        if: (success() || failure()) && github.event_name == 'pull_request' && steps.coverage.outputs.coverage != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          COVERAGE_VALUE: ${{ steps.coverage.outputs.coverage }}
          COVERAGE_MIN: ${{ env.COVERAGE_THRESHOLD }}
          FLAKY_COUNT: ${{ steps.flaky.outputs.flaky-count }}
          FLAKY_TESTS: ${{ steps.flaky.outputs.flaky-tests }}
        with:
          script: |
            const coverage = process.env.COVERAGE_VALUE;
            const threshold = parseFloat(process.env.COVERAGE_MIN);
            const passing = parseFloat(coverage) >= threshold;
            const icon = passing ? '✅' : '❌';

            const flakyCount = parseInt(process.env.FLAKY_COUNT || '0', 10);
            // FLAKY_TESTS is JSON-encoded by the detection script
            let flakyTests = '';
            try { flakyTests = JSON.parse(process.env.FLAKY_TESTS || '""'); } catch (e) { flakyTests = process.env.FLAKY_TESTS || ''; }

            const lines = [
              `## ${icon} Code Coverage: ${coverage}%`,
              '',
              `Threshold: ${threshold}%`,
              '',
              `${passing ? 'Coverage is above the minimum threshold.' : '**Coverage is below the minimum threshold. This is a blocking check — the PR cannot be merged.**'}`,
            ];

            if (flakyCount > 0) {
              lines.push('', `### Flaky Tests: ${flakyCount}`, '');
              lines.push(`${flakyTests}`);
              lines.push('', '_These tests failed initially but passed on retry._');
            }

            lines.push('', '_Generated by CI — see job summary for detailed file-level breakdown._');
            const body = lines.join('\n');

            // Find existing coverage comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Code Coverage:')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Verify every UI test class is listed in the shard matrix below.
  # Fails CI if someone adds a new test class and forgets to shard it.
  verify-ui-shards:
    name: Verify UI Test Shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check all UI test classes are sharded
        run: |
          # Extract concrete test class names (exclude base class PineUITestCase and on-demand ScreenshotTests)
          ACTUAL=$(grep -rh 'class.*:.*PineUITestCase' PineUITests/ \
            | sed -E 's/.*class ([A-Za-z0-9_]+).*/\1/' \
            | grep -v ScreenshotTests \
            | sort)

          # Extract class names from this workflow's shard matrix
          SHARDED=$(grep -E '^\s+\-only-testing:PineUITests/' .github/workflows/ci.yml \
            | sed -E 's/.*PineUITests\/([A-Za-z0-9_]+).*/\1/' \
            | sort)

          MISSING=$(comm -23 <(echo "$ACTUAL") <(echo "$SHARDED"))
          if [ -n "$MISSING" ]; then
            echo "::error::UI test classes not included in any shard:"
            echo "$MISSING"
            echo ""
            echo "Add them to the ui-tests matrix in .github/workflows/ci.yml"
            exit 1
          fi
          echo "All $(echo "$ACTUAL" | wc -l | tr -d ' ') UI test classes are sharded."

  # UI test shards — 7 parallel jobs, 24-27 tests each (delta ±3).
  # To rebalance: count tests per class, redistribute so shards stay within ±3 tests.
  # List classes with: grep -r "func test" PineUITests/ | sed 's/:.*//' | sort | uniq -c | sort -rn
  ui-tests:
    name: "UI Tests (${{ matrix.shard-name }})"
    runs-on: macos-26
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shard 1 — Terminal (26 tests)
          - shard-name: "Terminal"
            test-classes: >-
              -only-testing:PineUITests/TerminalTests
              -only-testing:PineUITests/TerminalMenuTests
          # Shard 2 — Welcome & Session (25 tests)
          - shard-name: "Welcome & Session"
            test-classes: >-
              -only-testing:PineUITests/WelcomeWindowTests
              -only-testing:PineUITests/ToggleCommentTests
              -only-testing:PineUITests/BlameViewTests
              -only-testing:PineUITests/MinimapTests
              -only-testing:PineUITests/DiffNavigationUITests
              -only-testing:PineUITests/SessionRestoreTests
          # Shard 3 — Navigation (27 tests)
          - shard-name: "Navigation"
            test-classes: >-
              -only-testing:PineUITests/GoToLineTabOverflowExternalChangesUITests
              -only-testing:PineUITests/QuickOpenUITests
              -only-testing:PineUITests/EditorTabNavigationTests
              -only-testing:PineUITests/SidebarFolderClickTests
          # Shard 4 — Editor Chrome (27 tests)
          - shard-name: "Editor Chrome"
            test-classes: >-
              -only-testing:PineUITests/EditorWindowTests
              -only-testing:PineUITests/ScreenshotTests
              -only-testing:PineUITests/BranchSwitcherTests
              -only-testing:PineUITests/CheckForUpdatesTests
              -only-testing:PineUITests/SplitPaneRoutingUITests
          # Shard 5 — Files & Save (27 tests)
          - shard-name: "Files & Save"
            test-classes: >-
              -only-testing:PineUITests/EditorSaveFlowTests
              -only-testing:PineUITests/HCLFormatOnSaveTests
              -only-testing:PineUITests/DeleteTests
              -only-testing:PineUITests/SidebarRenameTests
              -only-testing:PineUITests/SidebarFileOperationsTests
          # Shard 6 — Search & Panes (24 tests)
          - shard-name: "Search & Panes"
            test-classes: >-
              -only-testing:PineUITests/SidebarSearchTests
              -only-testing:PineUITests/DuplicateTests
              -only-testing:PineUITests/SplitPaneLifecycleTests
              -only-testing:PineUITests/FontSizeTests
          # Shard 7 — Security & Layout (24 tests)
          - shard-name: "Security & Layout"
            test-classes: >-
              -only-testing:PineUITests/GitignoreFilterTests
              -only-testing:PineUITests/SymlinkSecurityUITests
              -only-testing:PineUITests/MultiWindowTests
              -only-testing:PineUITests/InlineRenameAlignmentTests
              -only-testing:PineUITests/LineNumberGutterUITests
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Download Build Products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-products

      - name: Extract Build Products
        run: |
          sha256sum -c build-products.sha256
          for attempt in 1 2 3; do
            if tar --zstd -xf build-products.tar.zst; then
              echo "Extraction succeeded on attempt $attempt"
              break
            fi
            echo "::warning::Extraction failed on attempt $attempt, retrying..."
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Extraction failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

      # matrix.test-classes expands to multiple -only-testing: flags via YAML folded scalar (>-)
      - name: UI Tests
        run: |
          xcodebuild test-without-building \
            -project Pine.xcodeproj \
            -scheme Pine \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -retry-tests-on-failure \
            -resultBundlePath UITestResults.xcresult \
            ${{ matrix.test-classes }} \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO

      - name: Detect Flaky Tests
        if: success() || failure()
        run: |
          python3 .github/scripts/detect_flaky_tests.py \
            UITestResults.xcresult --github-summary \
            --output-file flaky-shard-${{ strategy.job-index }}.json

      - name: Upload Flaky Report
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flaky-ui-${{ strategy.job-index }}
          path: flaky-shard-${{ strategy.job-index }}.json
          retention-days: 1

  # Aggregate flaky UI test reports from all shards into a single PR comment
  flaky-summary:
    name: Flaky Test Summary
    runs-on: ubuntu-latest
    needs: ui-tests
    timeout-minutes: 10
    if: always() && needs.ui-tests.result != 'cancelled' && needs.ui-tests.result != 'skipped'
    steps:
      - name: Download Flaky Reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: flaky-ui-*
          merge-multiple: true
          path: flaky-reports

      - name: Aggregate Flaky Tests
        id: aggregate
        run: |
          # Merge all JSON reports into one list
          MERGED=$(python3 -c "
          import json, glob
          all_flaky = []
          for f in sorted(glob.glob('flaky-reports/flaky-shard-*.json')):
              with open(f) as fh:
                  data = json.load(fh)
                  all_flaky.extend(data)
          print(json.dumps(all_flaky))
          ")

          COUNT=$(echo "$MERGED" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "flaky-count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            # Build markdown table
            TABLE=$(echo "$MERGED" | python3 -c "
          import json, sys
          tests = json.load(sys.stdin)
          lines = []
          for t in sorted(tests, key=lambda x: (x['suite'], x['name'])):
              lines.append(f\"| {t['suite']} | {t['name']} | {t['failed_runs']}/{t['total_runs']} |\")
          print('\n'.join(lines))
          ")

            {
              echo "## Flaky UI Tests: $COUNT"
              echo ""
              echo "| Test Suite | Test Name | Failed Runs |"
              echo "|------------|-----------|-------------|"
              echo "$TABLE"
              echo ""
              echo "_These tests failed initially but passed on retry._"
            } >> "$GITHUB_STEP_SUMMARY"

            # Store for PR comment (JSON-encoded for safety)
            NAMES=$(echo "$MERGED" | python3 -c "
          import json, sys
          tests = json.load(sys.stdin)
          print(json.dumps(', '.join(f\"{t['suite']}/{t['name']}\" for t in tests)))
          ")
            echo "flaky-tests=$NAMES" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment Flaky UI Tests on PR
        if: github.event_name == 'pull_request' && steps.aggregate.outputs.flaky-count != '0' && steps.aggregate.outputs.flaky-count != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        env:
          FLAKY_COUNT: ${{ steps.aggregate.outputs.flaky-count }}
          FLAKY_TESTS: ${{ steps.aggregate.outputs.flaky-tests }}
        with:
          script: |
            const count = process.env.FLAKY_COUNT;
            let tests = '';
            try { tests = JSON.parse(process.env.FLAKY_TESTS || '""'); } catch (e) { tests = process.env.FLAKY_TESTS || ''; }

            const body = [
              `## Flaky UI Tests: ${count}`,
              '',
              tests,
              '',
              '_These tests failed initially but passed on retry. See job summary for details._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Flaky UI Tests:')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ──────────────────────────────────────────────────────────────────────────
  # Performance tests — OPT-IN only.
  #
  # PinePerformanceTests is enabled in the Pine scheme (`skipped="NO"`), so
  # Cmd+U in Xcode runs them locally. They are excluded from CI because every
  # CI job uses explicit `-only-testing:` filters that target only PineTests or
  # PineUITests. XCTest `measure {}` blocks are flaky on shared GitHub Actions
  # runners (noisy neighbors, no thermal guarantees), so running them on every
  # PR would produce false regressions. Instead this job only runs when:
  #
  #   1. Manually dispatched from the Actions tab (workflow_dispatch).
  #   2. A PR is labeled `perf` — add the label to run one-off benchmarks
  #      against a pull request without re-running the whole pipeline.
  #
  # Results are uploaded as a .xcresult artifact so the developer can open
  # them locally in Xcode's Test Navigator to inspect the measure {} numbers.
  performance-tests:
    name: Performance Tests (on-demand)
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: perf-${{ github.ref }}
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.run_performance_tests == 'true') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'perf'))
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Cache SPM Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Pine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # PinePerformanceTests is enabled in the scheme (`skipped="NO"`) but CI
      # jobs normally exclude it via `-only-testing:` filters. This job uses
      # `-only-testing:PinePerformanceTests` to run only the perf suite.
      # build-for-testing is a separate step so a missing-target failure
      # surfaces clearly before the measure {} loop kicks in.
      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project Pine.xcodeproj \
            -scheme Pine \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -only-testing:PinePerformanceTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Performance Tests
        run: |
          xcodebuild test-without-building \
            -project Pine.xcodeproj \
            -scheme Pine \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -only-testing:PinePerformanceTests \
            -resultBundlePath PerformanceResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Performance Results
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-results-xcresult
          path: PerformanceResults.xcresult
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # Fuzz tests — OPT-IN only.
  #
  # Fuzz tests generate random input data and can occasionally hit pathological
  # cases (large strings, regex backtracking) that exceed the default test time
  # limit. They are excluded from the blocking unit-tests job via -skip-testing:
  # flags and run here only when:
  #
  #   1. A PR is labeled `fuzz` — add the label to run fuzz tests against a
  #      pull request without re-running the whole pipeline.
  #
  # For nightly scheduled runs, see .github/workflows/nightly-fuzz.yml.
  fuzz-tests:
    name: Fuzz Tests (on-demand)
    runs-on: macos-26
    timeout-minutes: 30
    concurrency:
      group: fuzz-${{ github.ref }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'fuzz')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Download Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain

      - name: Cache SPM Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Pine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project Pine.xcodeproj \
            -scheme Pine \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -only-testing:PineTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Fuzz Tests
        run: |
          xcodebuild test-without-building \
            -project Pine.xcodeproj \
            -scheme Pine \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -only-testing:PineTests/FuzzGitDiffParserTests \
            -only-testing:PineTests/FuzzGitBlameParserTests \
            -only-testing:PineTests/FuzzGitStatusParserTests \
            -only-testing:PineTests/FuzzSyntaxHighlighterTests \
            -only-testing:PineTests/FuzzQuickOpenProviderTests \
            -only-testing:PineTests/FuzzSymbolParserTests \
            -only-testing:PineTests/FuzzConfigValidatorTests \
            -only-testing:PineTests/FuzzGoToLineParserTests \
            -resultBundlePath FuzzResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Fuzz Results
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-results-xcresult
          path: FuzzResults.xcresult
          retention-days: 14
