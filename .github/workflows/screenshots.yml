# NOTE: All third-party actions are pinned by full commit SHA for supply-chain safety.
name: Update Screenshots

on:
  workflow_dispatch:
  release:
    types: [published]

# contents: write -> the Commit screenshots step creates a branch and pushes
#   it. pull-requests: write -> the same step opens a PR against main.
# issues: write -> the Create Issue on Failure step opens a tracking issue when
#   the pipeline breaks (mirrors nightly-perf/nightly-fuzz).
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  screenshots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Checkout main (not the release tag) so screenshots are generated
          # from the current main tree, and the Commit screenshots step can
          # branch off main. Without this, release-published runs land in
          # detached HEAD on the tag (issue #1030).
          ref: main

      - name: Run screenshot tests and extract
        # The script soft-fails xcodebuild but hard-fails if extraction
        # produces no usable PNGs. Do NOT add continue-on-error here.
        run: bash scripts/update-screenshots.sh

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots-xcresult
          path: build/screenshots.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit screenshots
        env:
          # Prefer the PAT so CI runs on the PR; fall back to GITHUB_TOKEN.
          # PRs created by the default GITHUB_TOKEN do NOT trigger downstream
          # workflow runs, which would leave the PR without required status
          # checks and block the merge behind branch protection.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Remove diagnostic fallback artifacts (screenshot-unknown-*.png)
          # so they never accidentally end up in a commit. They are also
          # gitignored, but be explicit and defensive.
          rm -f assets/screenshot-unknown-*.png

          # Stage only the canonical, named screenshots. We explicitly
          # enumerate them (rather than `assets/screenshot-*.png`) so a
          # stray ignored path can never make `git add` exit non-zero
          # under `bash -e` — that exact failure mode is what historically
          # blocked this workflow on every release tag.
          shopt -s nullglob
          NAMED=(
            assets/screenshot-welcome.png
            assets/screenshot-editor.png
            assets/screenshot-terminal.png
            assets/screenshot-markdown.png
            assets/screenshot-sidebar.png
            assets/screenshot-minimap.png
          )
          EXISTING=()
          for f in "${NAMED[@]}"; do
            [ -f "$f" ] && EXISTING+=("$f")
          done
          if [ "${#EXISTING[@]}" -eq 0 ]; then
            echo "Error: no canonical screenshots found in assets/." >&2
            exit 1
          fi
          # --force: if any of these paths is ever (re-)added to .gitignore
          # by mistake, we still want the workflow to succeed.
          git add --force "${EXISTING[@]}"

          if git diff --staged --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi

          # ------------------------------------------------------------------
          # Branch + PR instead of a direct push to main.
          #
          # Branch protection requires 11 status checks before any push to
          # main is accepted (GH013: "Repository rule violations found for
          # refs/heads/main"). The previous approach (checkout main → commit
          # → push) was rejected at push time (#1038). Instead we create a
          # branch, commit there, and open a PR for manual merge.
          #
          # GH_TOKEN uses RELEASE_PLEASE_TOKEN (an existing PAT) when
          # available so that CI workflows actually trigger on the PR —
          # PRs created by the default GITHUB_TOKEN do NOT trigger
          # downstream workflow runs (known GitHub limitation), which
          # would leave the PR without the required status checks and
          # block the merge.
          #
          # Dedupe (#1077): a FIXED branch name is used instead of a
          # timestamped one. Before pushing, any pre-existing open PR on
          # this branch is closed (and its branch deleted) so repeated
          # workflow_dispatch / release triggers never pile up duplicate
          # screenshot PRs. Combined with the git diff --staged --quiet
          # guard above, a run with no meaningful pixel change opens no
          # PR at all.
          # ------------------------------------------------------------------
          BRANCH="chore/screenshots-update"

          # Close any pre-existing open PR on this branch and delete the
          # stale remote branch so the force-push below is clean. `gh pr
          # list` returns at most one number for a fixed head branch.
          EXISTING_PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')
          if [ -n "$EXISTING_PRS" ]; then
            for pr in $EXISTING_PRS; do
              echo "Closing stale screenshot PR #$pr before re-running."
              gh pr close "$pr" --delete-branch || true
            done
          fi

          # Reset to a fresh branch off main and commit the staged changes.
          git checkout -B "$BRANCH"
          git commit -m "chore: update screenshots"
          # Force-push: the branch name is fixed and any stale copy was
          # already deleted above (or never existed).
          git push --force -u origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: update screenshots" \
            --body "Automated screenshot update generated by the **Update Screenshots** workflow.

          Triggered by: ${{ github.event_name }}

          Merge after reviewing the PNG diff. The screenshots reflect the current state of \`main\`."

      # Mirrors the failure-notification pattern in nightly-perf.yml /
      # nightly-fuzz.yml so a broken release-screenshot pipeline can never
      # again stay broken across multiple releases unnoticed (see issue #996).
      - name: Create Issue on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Screenshots pipeline failed ($(date -u '+%Y-%m-%d'))" \
            --body "## Summary

          The release screenshots workflow failed. The marketing screenshots in
          \`assets/\` were **NOT** updated for this release.

          **Run:** $RUN_URL

          ## Next steps

          1. Check the workflow logs — the failure is usually in the
             \`Run screenshot tests and extract\` step (xcresult extraction)
          2. Download the \`screenshots-xcresult\` artifact (if uploaded) to
             inspect the test bundle directly
          3. Re-run locally with \`bash scripts/update-screenshots.sh\` to
             reproduce, then re-trigger via Actions → Update Screenshots →
             Run workflow after fixing the script" \
            --label "bug,CI"
