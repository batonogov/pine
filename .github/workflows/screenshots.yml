# NOTE: All third-party actions are pinned by full commit SHA for supply-chain safety.
name: Update Screenshots

on:
  workflow_dispatch:
  release:
    types: [published]

# contents: write -> the Commit screenshots step pushes the screenshot commit
#   to a bot branch. pull-requests: write -> opens/updates the PR that carries
#   those screenshots into main (main itself is protected by repository rules,
#   so a direct push is rejected with GH013).
# issues: write -> the Create Issue on Failure step opens a tracking issue when
#   the pipeline breaks (mirrors nightly-perf/nightly-fuzz).
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  screenshots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Checkout main (not the release tag) so the Commit screenshots
          # step can push back to main. Without this, release-published
          # runs land in detached HEAD on the tag and `git push` fails with
          # "You are not currently on a branch." (issue #1030)
          ref: main

      - name: Run screenshot tests and extract
        # The script soft-fails xcodebuild but hard-fails if extraction
        # produces no usable PNGs. Do NOT add continue-on-error here.
        run: bash scripts/update-screenshots.sh

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots-xcresult
          path: build/screenshots.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Remove diagnostic fallback artifacts (screenshot-unknown-*.png)
          # so they never accidentally end up in a commit. They are also
          # gitignored, but be explicit and defensive.
          rm -f assets/screenshot-unknown-*.png

          # Stage only the canonical, named screenshots. We explicitly
          # enumerate them (rather than `assets/screenshot-*.png`) so a
          # stray ignored path can never make `git add` exit non-zero
          # under `bash -e` — that exact failure mode is what historically
          # blocked this workflow on every release tag.
          shopt -s nullglob
          NAMED=(
            assets/screenshot-welcome.png
            assets/screenshot-editor.png
            assets/screenshot-terminal.png
            assets/screenshot-markdown.png
            assets/screenshot-sidebar.png
            assets/screenshot-minimap.png
          )
          EXISTING=()
          for f in "${NAMED[@]}"; do
            [ -f "$f" ] && EXISTING+=("$f")
          done
          if [ "${#EXISTING[@]}" -eq 0 ]; then
            echo "Error: no canonical screenshots found in assets/." >&2
            exit 1
          fi
          # --force: if any of these paths is ever (re-)added to .gitignore
          # by mistake, we still want the workflow to succeed.
          git add --force "${EXISTING[@]}"

          if git diff --staged --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi

          # `main` is protected by repository rules (11 required status
          # checks), so a direct push from CI is rejected with GH013. Push
          # to a dedicated bot branch and open (or update) a PR instead; the
          # human merges it once CI is green. This keeps the release-
          # screenshot flow compatible with branch protection (issue #1030).
          #
          # `--force` is safe here: chore/update-screenshots is an autonomous
          # bot branch with no human commits, so each run converges on a
          # single open PR rather than piling up branches.
          BRANCH="chore/update-screenshots"
          git checkout -B "$BRANCH"
          git commit -m "chore: update screenshots"
          git push --force origin "$BRANCH"

          # Create the PR once; subsequent runs update it via the force-push.
          OPEN_COUNT=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')
          if [ "$OPEN_COUNT" = "0" ]; then
            gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "chore: update screenshots" \
              --body "Automated screenshot regeneration from the **Update Screenshots** workflow.

          **Run:** $RUN_URL

          Review the PNG diff before merging. Auto-generated by a release-published or manual trigger."
            echo "Created PR for $BRANCH."
          else
            echo "PR for $BRANCH already open; updated by force-push."
          fi

      # Mirrors the failure-notification pattern in nightly-perf.yml /
      # nightly-fuzz.yml so a broken release-screenshot pipeline can never
      # again stay broken across multiple releases unnoticed (see issue #996).
      - name: Create Issue on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Screenshots pipeline failed ($(date -u '+%Y-%m-%d'))" \
            --body "## Summary

          The release screenshots workflow failed. The marketing screenshots in
          \`assets/\` were **NOT** updated for this release.

          **Run:** $RUN_URL

          ## Next steps

          1. Check the workflow logs — the failure is usually in the
             \`Run screenshot tests and extract\` step (xcresult extraction)
          2. Download the \`screenshots-xcresult\` artifact (if uploaded) to
             inspect the test bundle directly
          3. Re-run locally with \`bash scripts/update-screenshots.sh\` to
             reproduce, then re-trigger via Actions → Update Screenshots →
             Run workflow after fixing the script" \
            --label "bug,CI"
