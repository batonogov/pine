name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Docs validation
        run: echo "Docs-only PR — no build required"
