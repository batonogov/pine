<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <defs>
    <clipPath id="win"><rect x="10" y="10" width="1180" height="760" rx="14"/></clipPath>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="coastC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9E8E2"/><stop offset="0.55" stop-color="#BFD9D2"/><stop offset="0.56" stop-color="#8FB4C4"/><stop offset="1" stop-color="#7FA6B8"/>
    </linearGradient>
  </defs>
  <style>
    .t1{fill:#1F2124}.t2{fill:#6C6F76}.t3{fill:#9C9FA6}
    .acc{fill:#2E5D44}.suc{fill:#2F8A57}.wrn{fill:#B97514}.err{fill:#C0453A}
    .sem{font-weight:600}.b{font-weight:700}
  </style>

  <rect x="10" y="10" width="1180" height="760" rx="14" fill="#F7F6F3" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <circle cx="34" cy="36" r="6.5" fill="#FF5F57"/><circle cx="54" cy="36" r="6.5" fill="#FEBC2E"/><circle cx="74" cy="36" r="6.5" fill="#28C840"/>
    <path d="M40 66 L48 80 L44 80 L51 92 L29 92 L36 80 L32 80 Z" class="acc"/>
    <rect x="38.6" y="92" width="2.8" height="6" class="acc"/>
    <text x="62" y="86" font-size="15" class="sem t1">Pine 3</text>
    <rect x="1006" y="24" width="100" height="28" rx="14" class="acc"/>
    <text x="1056" y="43" font-size="13" fill="#FFFFFF" class="sem" text-anchor="middle">New task</text>
    <g fill="#9C9FA6"><circle cx="1146" cy="38" r="1.7"/><circle cx="1152" cy="38" r="1.7"/><circle cx="1158" cy="38" r="1.7"/></g>
    <line x1="10" y1="104" x2="1190" y2="104" stroke="#E2E0DA"/>

    <!-- queue header -->
    <text x="40" y="146" font-size="26" class="b t1">Inbox</text>
    <text x="40" y="170" font-size="13" class="t2">3 items need your attention · 2 projects</text>

    <!-- Ready group -->
    <text x="40" y="206" font-size="11" class="t3 sem" letter-spacing="0.8">READY</text>
    <line x1="40" y1="224" x2="1160" y2="224" stroke="#E7E5DF"/>
    <rect x="40" y="224" width="1120" height="64" fill="#FFFFFF" opacity="0"/>
    <circle cx="62" cy="256" r="9" fill="none" stroke="#2F8A57" stroke-width="1.8"/><path d="M58 256 l2.8 3.2 l5.4 -6.2" fill="none" stroke="#2F8A57" stroke-width="1.8" stroke-linecap="round"/>
    <text x="88" y="251" font-size="14.5" class="sem t1">Plan a weekend</text>
    <text x="88" y="272" font-size="12" class="t2">Atlas · 12 min ago</text>
    <rect x="986" y="232" width="120" height="48" rx="6" fill="url(#coastC)"/>
    <text x="996" y="250" font-size="11" fill="#FFFFFF" font-family="Georgia, serif">Atlas</text>
    <path d="M986 264 q 30 -6 60 -2 t 60 -2 v12 h-120 z" fill="#8FB4C4" opacity="0.85"/>
    <path d="M1128 248 l8 8 l-8 8" fill="none" stroke="#C9C6BE" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="40" y1="288" x2="1160" y2="288" stroke="#E7E5DF"/>

    <!-- Needs input group -->
    <text x="40" y="322" font-size="11" class="t3 sem" letter-spacing="0.8">NEEDS INPUT</text>
    <line x1="40" y1="340" x2="1160" y2="340" stroke="#E7E5DF"/>
    <circle cx="62" cy="372" r="9" fill="none" stroke="#B97514" stroke-width="1.8"/><text x="62" y="377" font-size="11" fill="#B97514" text-anchor="middle" class="b">?</text>
    <text x="88" y="367" font-size="14.5" class="sem t1">Improve search</text>
    <text x="88" y="388" font-size="12" class="t2">Atlas · Which map provider should we use?</text>
    <rect x="986" y="356" width="142" height="32" rx="16" fill="#ECEAE3"/>
    <text x="1057" y="376" font-size="13" class="t1" text-anchor="middle">Review question</text>
    <line x1="40" y1="404" x2="1160" y2="404" stroke="#E7E5DF"/>

    <!-- Failed group -->
    <text x="40" y="438" font-size="11" class="t3 sem" letter-spacing="0.8">FAILED</text>
    <line x1="40" y1="456" x2="1160" y2="456" stroke="#E7E5DF"/>
    <circle cx="62" cy="488" r="9" fill="none" stroke="#C0453A" stroke-width="1.8"/><path d="M58.8 484.8 l6.4 6.4 M65.2 484.8 l-6.4 6.4" stroke="#C0453A" stroke-width="1.8" stroke-linecap="round"/>
    <text x="88" y="483" font-size="14.5" class="sem t1">Fix navigation</text>
    <text x="88" y="504" font-size="12" class="t2">Fieldnotes · Checks failed — build</text>
    <path d="M1128 480 l8 8 l-8 8" fill="none" stroke="#C9C6BE" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="40" y1="520" x2="1160" y2="520" stroke="#E7E5DF"/>

    <!-- Projects section -->
    <text x="40" y="556" font-size="11" class="t3 sem" letter-spacing="0.8">PROJECTS</text>
    <line x1="40" y1="574" x2="1160" y2="574" stroke="#E7E5DF"/>
    <path d="M54 598 h6 l2 3 h8 v10 h-16 z" fill="none" stroke="#6C6F76" stroke-width="1.6"/>
    <text x="88" y="603" font-size="14.5" class="sem t1">Atlas</text>
    <text x="88" y="624" font-size="12" class="t2">1 ready · 1 needs input · 1 working</text>
    <path d="M1128 596 l8 8 l-8 8" fill="none" stroke="#C9C6BE" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="40" y1="640" x2="1160" y2="640" stroke="#E7E5DF"/>
    <path d="M54 664 h6 l2 3 h8 v10 h-16 z" fill="none" stroke="#6C6F76" stroke-width="1.6"/>
    <text x="88" y="669" font-size="14.5" class="t1">Fieldnotes</text>
    <text x="88" y="690" font-size="12" class="t2">1 failed · 2 idle</text>
    <path d="M1128 662 l8 8 l-8 8" fill="none" stroke="#C9C6BE" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <rect x="10" y="10" width="1180" height="760" rx="14" fill="none" stroke="#D8D5CE"/>
</svg>
