    <path d="M288 446 q 120 -16 240 -8 t 240 -2 t 194 -4 v40 h-874 z" fill="#8FB0C0"/>
    <g fill="#E8A7C4"><circle cx="322" cy="458" r="3"/><circle cx="338" cy="466" r="3"/><circle cx="356" cy="456" r="3"/><circle cx="372" cy="468" r="3"/><circle cx="388" cy="460" r="3"/></g>
    </g>
    <text x="316" y="368" font-size="30" fill="#FFFFFF" font-family="Georgia, serif" class="b">A weekend</text>
