      <text x="316" y="580" font-size="9.5" class="t3">Day 1</text>
      <text x="316" y="597" font-size="13" class="sem t1">Arrive &amp; settle</text>
      <text x="316" y="613" font-size="9.5" class="t2">A scenic drive, a seaside stay,</text>
      <text x="316" y="626" font-size="9.5" class="t2">and a sunset walk.</text>
      <rect x="596" y="496" width="272" height="128" rx="8" fill="#FBFAF7" stroke="#EFEDE7"/>
      <rect x="608" y="508" width="248" height="52" rx="5" fill="url(#coast3)"/>
      <rect x="700" y="520" width="10" height="34" fill="#F4EFE4" stroke="#D8CDB4"/><rect x="696" y="516" width="18" height="6" fill="#C9B98F"/>
