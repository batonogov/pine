      <text x="608" y="597" font-size="13" class="sem t1">Explore the coast</text>
      <text x="608" y="613" font-size="9.5" class="t2">Clifftop trails, local food,</text>
      <text x="608" y="626" font-size="9.5" class="t2">and hidden beaches.</text>
      <rect x="888" y="496" width="258" height="128" rx="8" fill="#FBFAF7" stroke="#EFEDE7"/>
      <rect x="900" y="508" width="234" height="52" rx="5" fill="url(#coast3)"/>
      <g fill="#F4EFE4"><rect x="940" y="528" width="22" height="16"/><rect x="968" y="522" width="22" height="22"/><rect x="996" y="530" width="22" height="14"/></g>
      <text x="900" y="580" font-size="9.5" class="t3">Day 3</text>
      <text x="900" y="597" font-size="13" class="sem t1">Savor &amp; return</text>
      <text x="900" y="613" font-size="9.5" class="t2">A slow morning, a final stop,</text>
      <text x="900" y="626" font-size="9.5" class="t2">then head home.</text>
    </g>
    <text x="288" y="662" font-size="11.5" class="t3">Preview · Checked revision · a3f9c2d1…</text>

