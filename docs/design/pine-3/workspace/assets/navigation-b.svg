<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <style>
    .t1{fill:#1F2124}.t2{fill:#6C6F76}.t3{fill:#9C9FA6}
    .sem{font-weight:600}.b{font-weight:700}
    .arrow{stroke:#9C9FA6;stroke-width:1.6;fill:none;marker-end:url(#ah)}
    .tl{fill:#C9D1D9}
    .mono{font-family:'SF Mono', ui-monospace, Menlo, monospace}
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#9C9FA6"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="900" height="250" fill="#F7F6F3"/>
  <text x="24" y="36" font-size="15" class="b t1">Navigation — B: Terminal canvas</text>

  <!-- rail -->
  <rect x="24" y="60" width="110" height="160" rx="10" fill="#EFEEEA" stroke="#E2E0DA"/>
  <text x="40" y="88" font-size="11" class="t2 sem">Inbox</text>
  <text x="40" y="112" font-size="11" class="t1 sem">Atlas</text>
  <text x="50" y="132" font-size="10" class="t2">Plan a weekend</text>
  <text x="50" y="150" font-size="10" class="t2">Improve search</text>
  <text x="79" y="236" font-size="10.5" class="t3" text-anchor="middle">persistent rail</text>

  <!-- terminal home (dark) -->
  <rect x="186" y="64" width="330" height="118" rx="10" fill="#1F242B"/>
  <text x="206" y="92" font-size="11" class="mono tl">◆ Working — editing itinerary.tsx</text>
  <text x="206" y="114" font-size="11" class="mono tl">✓ npx vite build</text>
  <text x="206" y="136" font-size="11" class="mono" fill="#7EE0A3">◇ Reviewing …</text>
  <text x="351" y="200" font-size="11" class="t1 sem" text-anchor="middle">Terminal home — the task's real PTY, always the canvas</text>

  <!-- code split -->
  <rect x="186" y="214" width="330" height="28" rx="8" fill="#FFFFFF" stroke="#D8D5CE"/>
  <text x="351" y="232" font-size="11" class="t2" text-anchor="middle">code / diff split beside the terminal (2.x pane behavior)</text>
  <path class="arrow" d="M351 214 V196" opacity="0"/>
  <path d="M351 212 V194" fill="none" stroke="#9C9FA6" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah)"/>

  <!-- result sheet (floating) -->
  <rect x="560" y="76" width="300" height="124" rx="12" fill="#F7F6F3" stroke="#D8D5CE" filter="url(#sh)"/>
  <text x="580" y="104" font-size="12.5" class="sem t1">Plan a weekend · Ready</text>
  <rect x="580" y="116" width="112" height="26" rx="7" fill="#2E5D44"/>
  <text x="636" y="133" font-size="11" fill="#FFFFFF" text-anchor="middle" class="sem">Open preview</text>
  <text x="704" y="133" font-size="10" class="t3">local dev server</text>
  <text x="580" y="168" font-size="10.5" class="t2">✓ Checks passed · Review passed · 1 limitation ›</text>
  <text x="580" y="186" font-size="10.5" class="t3">Accept result (secondary)</text>
  <text x="710" y="220" font-size="11" class="t1 sem" text-anchor="middle">Result sheet — summoned over the terminal, then closed back</text>

  <!-- arrows -->
  <path class="arrow" d="M134 110 H186"/>
  <text x="160" y="102" font-size="10.5" class="t3" text-anchor="middle">open</text>
  <path d="M470 108 Q 520 92 558 104" fill="none" stroke="#9C9FA6" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah)"/>
  <text x="514" y="86" font-size="10.5" class="t3" text-anchor="middle">Ready badge (pull, not push)</text>
</svg>
