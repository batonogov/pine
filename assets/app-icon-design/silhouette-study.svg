<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080">
  <rect width="1600" height="1080" fill="#F5F5F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" fill="#17181A">
    <text x="90" y="90" font-size="44" font-weight="700">Pine app icon — silhouette study</text>
    <text x="90" y="132" font-size="22" fill="#64666A">Identity first: black artwork, no color, material, highlights, glow, or shadow</text>
  </g>

  <g transform="translate(74 190)">
    <rect width="452" height="560" rx="32" fill="#FFFFFF"/>
    <text x="32" y="52" font-family="-apple-system, sans-serif" font-size="25" font-weight="650" fill="#17181A">1  Clean reconstruction</text>
    <text x="32" y="84" font-family="-apple-system, sans-serif" font-size="18" fill="#74767A">Familiar, but fragments at small sizes</text>
    <g transform="translate(-10 80) scale(.46)" fill="#17181A">
