    </g>
    <text x="32" y="500" font-family="-apple-system, sans-serif" font-size="18" fill="#525458">One compact mass; width rhythm and ± offset</text>
    <text x="32" y="528" font-family="-apple-system, sans-serif" font-size="18" fill="#525458">preserve layer order without relying on color.</text>
  </g>

