    <text x="32" y="52" font-family="-apple-system, sans-serif" font-size="25" font-weight="650" fill="#17181A">2  Compact Stack</text>
    <text x="32" y="84" font-family="-apple-system, sans-serif" font-size="18" fill="#525458">Selected production direction</text>
    <g transform="translate(-10 78) scale(.46)" fill="#17181A">
