<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1320" height="840" viewBox="0 0 660 420">
  <defs>
    <linearGradient id="surface" x1="76" y1="18" x2="592" y2="410"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbf9"/>
      <stop offset="0.52" stop-color="#edf3ef"/>
      <stop offset="1" stop-color="#e3ebe6"/>
    </linearGradient>
    <radialGradient id="leftLight" cx="0" cy="0" r="1"
                    gradientTransform="translate(170 205) rotate(90) scale(205 230)"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#56cf8b" stop-opacity="0.18"/>
      <stop offset="0.52" stop-color="#56cf8b" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#56cf8b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightLight" cx="0" cy="0" r="1"
                    gradientTransform="translate(490 205) rotate(90) scale(205 230)"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#61afef" stop-opacity="0.15"/>
      <stop offset="0.52" stop-color="#61afef" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#61afef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iceLayer" x1="92" y1="82" x2="572" y2="201"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#cceff1" stop-opacity="0.64"/>
      <stop offset="0.48" stop-color="#dceff2" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="mintLayer" x1="76" y1="153" x2="584" y2="274"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#bdebcf" stop-opacity="0.46"/>
      <stop offset="0.5" stop-color="#ccebd7" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#e5f3ea" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="blueLayer" x1="101" y1="221" x2="559" y2="339"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#cfe2ed" stop-opacity="0.5"/>
      <stop offset="0.52" stop-color="#d8e8ed" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#c8dce9" stop-opacity="0.46"/>
    </linearGradient>
    <linearGradient id="arrow" x1="312" y1="210" x2="348" y2="210"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#16864f"/>
      <stop offset="1" stop-color="#2ba968"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-160%" width="300%" height="420%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <rect width="660" height="420" fill="url(#surface)"/>
  <rect width="660" height="420" fill="url(#leftLight)"/>
  <rect width="660" height="420" fill="url(#rightLight)"/>

  <!-- Pine's three layers become the space rather than a decorative logo. -->
  <g>
    <rect x="92" y="82" width="476" height="112" rx="38"
          transform="rotate(-1.4 330 138)"
          fill="url(#iceLayer)" stroke="#87b7bd" stroke-opacity="0.24"/>
    <rect x="76" y="153" width="508" height="118" rx="40"
          transform="rotate(0.8 330 212)"
          fill="url(#mintLayer)" stroke="#66b988" stroke-opacity="0.26"/>
    <rect x="101" y="221" width="458" height="116" rx="40"
          transform="rotate(-1.1 330 279)"
          fill="url(#blueLayer)" stroke="#7daec9" stroke-opacity="0.24"/>
  </g>

  <!-- One obvious gesture. The real app and Applications icons supply the nouns. -->
  <path d="M312 210H348M337 199L348 210L337 221"
        fill="none" stroke="#56cf8b" stroke-opacity="0.2" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#softGlow)"/>
  <path d="M312 210H348M337 199L348 210L337 221"
        fill="none" stroke="url(#arrow)" stroke-width="3.25"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
