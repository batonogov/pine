<main class="help-topic">
    <nav class="breadcrumbs"><a href="index.html">Pine帮助</a></nav>

    <section id="git">
        <a name="pine-git" id="pine-git"></a>
        <h2>Git集成</h2>
        <div class="feature-grid">
            <div class="card">
                <h3>文件状态</h3>
                <p>侧边栏以彩色状态指示显示已修改、已添加和已删除的文件。</p>
            </div>
            <div class="card">
                <h3>差异标记</h3>
                <p>新增、修改和删除的行以彩色标记显示在编辑器装订线中。</p>
            </div>
            <div class="card">
                <h3>切换分支</h3>
                <p>点击标题栏中的分支名或按Cmd+Shift+B可在本地分支之间切换。</p>
            </div>
            <div class="card">
                <h3>Blame视图</h3>
                <p>切换Blame视图以查看每行的提交信息：哈希、作者、时间戳和消息。</p>
            </div>
        </div>
    </section>
