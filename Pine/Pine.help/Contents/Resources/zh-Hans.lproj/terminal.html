    <section id="terminal">
        <a name="pine-terminal" id="pine-terminal"></a>
        <h2>终端与快速终端</h2>
        <div class="feature-grid">
            <div class="card">
                <h3>集成终端</h3>
                <p>在代码旁使用完整的终端。只要标签页保持打开，滚动历史就会保留。</p>
            </div>
            <div class="card">
                <h3>快速终端</h3>
                <p>按Ctrl+Option+空格切换一个悬浮在任何应用上方的下拉式终端。</p>
            </div>
            <div class="card">
                <h3>可点击链接</h3>
                <p>在终端输出中按住Cmd点击“文件:行”引用即可在编辑器中打开。URL会在系统浏览器中打开。</p>
            </div>
            <div class="card">
                <h3>TUI应用</h3>
                <p>Vim、htop等TUI应用可原生运行。完全支持oh-my-zsh和颜色主题。</p>
            </div>
        </div>
    </section>
