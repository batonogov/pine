<main class="help-topic">
    <nav class="breadcrumbs"><a href="index.html">Pine帮助</a></nav>

    <section id="workspace">
        <a name="pine-workspace" id="pine-workspace"></a>
        <h2>编辑器、窗格与终端</h2>
        <div class="feature-grid">
            <div class="card">
                <h3>预览与固定标签页</h3>
                <p>点击侧边栏中的文件会以临时预览标签页打开。双击或编辑即可固定它。</p>
            </div>
            <div class="card">
                <h3>Markdown预览</h3>
                <p>按Cmd+Shift+P在仅源代码、渲染和并排Markdown预览之间循环切换。</p>
            </div>
            <div class="card">
                <h3>安全保存</h3>
                <p>有修改的标签页在关闭前会受到保护。“自动保存”和“保存时格式化”位于“文件”菜单。</p>
            </div>
            <div class="card">
                <h3>会话恢复</h3>
                <p>重新打开项目时，Pine会恢复您的标签页、窗格布局和光标位置。</p>
            </div>
        </div>
    </section>

    <nav class="topic-footer"><a href="index.html">← Pine帮助</a></nav>
