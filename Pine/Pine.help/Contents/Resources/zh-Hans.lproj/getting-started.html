    <section id="getting-started">
        <a name="pine-getting-started" id="pine-getting-started"></a>
        <h2>开始使用</h2>
        <div class="steps">
            <div class="card">
                <h3>1. 打开文件夹</h3>
                <p>选择“文件”&gt;“打开文件夹”，然后选择包含项目的目录。</p>
            </div>
            <div class="card">
                <h3>2. 打开文件</h3>
                <p>在侧边栏选择文件，或用快速打开按名称查找。</p>
            </div>
            <div class="card">
                <h3>3. 整理工作区</h3>
                <p>将标签页拖到编辑器边缘以创建分屏，或拖到其他标签栏以移动。</p>
            </div>
            <div class="card">
                <h3>4. 继续工作</h3>
                <p>Pine会在您返回时恢复项目窗口、编辑器标签页和窗格布局。</p>
            </div>
        </div>
    </section>
