    <section id="shortcuts">
        <a name="pine-shortcuts" id="pine-shortcuts"></a>
        <h2>常用快捷键</h2>
        <div class="shortcut-grid">
            <div class="shortcut"><span>打开文件夹</span><kbd>⇧⌘O</kbd></div>
            <div class="shortcut"><span>快速打开</span><kbd>⌘P</kbd></div>
            <div class="shortcut"><span>查找</span><kbd>⌘F</kbd></div>
            <div class="shortcut"><span>在项目中查找</span><kbd>⇧⌘F</kbd></div>
            <div class="shortcut"><span>查找与替换</span><kbd>⌥⌘F</kbd></div>
            <div class="shortcut"><span>跳转到行</span><kbd>⌘L</kbd></div>
            <div class="shortcut"><span>跳转到符号</span><kbd>⌘R</kbd></div>
            <div class="shortcut"><span>保存</span><kbd>⌘S</kbd></div>
            <div class="shortcut"><span>显示/隐藏终端</span><kbd>⌘`</kbd></div>
            <div class="shortcut"><span>新建终端标签页</span><kbd>⌘T</kbd></div>
            <div class="shortcut"><span>切换 Markdown 预览</span><kbd>⇧⌘P</kbd></div>
            <div class="shortcut"><span>切换Git分支</span><kbd>⇧⌘B</kbd></div>
            <div class="shortcut"><span>快速终端</span><kbd>⌃⌥Space</kbd></div>
            <div class="shortcut"><span>切换注释</span><kbd>⌘/</kbd></div>
            <div class="shortcut"><span>迷你地图</span><kbd>⇧⌘M</kbd></div>
            <div class="shortcut"><span>自动换行</span><kbd>⌥⌘Z</kbd></div>
            <div class="shortcut"><span>下一个 / 上一个更改</span><kbd>⌃⌥↓/↑</kbd></div>
            <div class="shortcut"><span>下一个 / 上一个诊断</span><kbd>⌥⌘↓/↑</kbd></div>
        </div>
        <p class="tip"><strong>提示：</strong>菜单中会显示所有可用命令及其当前快捷键。</p>
    </section>
