        <a name="pine-settings" id="pine-settings"></a>
        <h2>设置与键绑定</h2>
        <div class="feature-grid">
            <div class="card">
                <h3>设置窗口</h3>
                <p>按Cmd+逗号打开设置。配置编辑器默认值、终端、语言服务器和代理隐私。</p>
            </div>
            <div class="card">
                <h3>自定义键绑定</h3>
                <p>通过受管理的键绑定文件覆盖键盘快捷键。命令面板会显示当前有效的绑定。</p>
            </div>
            <div class="card">
                <h3>命令面板</h3>
                <p>通过支持模糊搜索的面板发现并运行命令，类似于VS Code。</p>
            </div>
            <div class="card">
                <h3>任务</h3>
                <p>定义自定义任务，从命令面板或“任务”菜单运行 shell 命令、格式化工具或构建脚本。</p>
            </div>
        </div>
    </section>
