<main class="help-topic">
    <nav class="breadcrumbs"><a href="index.html">Pine Help</a></nav>

    <section id="shortcuts">
        <a name="pine-shortcuts" id="pine-shortcuts"></a>
        <h2>Essential shortcuts</h2>
        <div class="shortcut-grid">
            <div class="shortcut"><span>Open Folder</span><kbd>⇧⌘O</kbd></div>
            <div class="shortcut"><span>Save</span><kbd>⌘S</kbd></div>
            <div class="shortcut"><span>Toggle Terminal</span><kbd>⌘`</kbd></div>
            <div class="shortcut"><span>New Terminal Tab</span><kbd>⌘T</kbd></div>
            <div class="shortcut"><span>Toggle Markdown Preview</span><kbd>⇧⌘P</kbd></div>
            <div class="shortcut"><span>Quick Terminal</span><kbd>⌃⌥Space</kbd></div>
            <div class="shortcut"><span>Toggle Comment</span><kbd>⌘/</kbd></div>
            <div class="shortcut"><span>Word Wrap</span><kbd>⌥⌘Z</kbd></div>
            <div class="shortcut"><span>Next / Prev Change</span><kbd>⌃⌥↓/↑</kbd></div>
        </div>
        <p class="tip"><strong>Tip:</strong> Menus show every available command and its current keyboard shortcut.</p>
    </section>
