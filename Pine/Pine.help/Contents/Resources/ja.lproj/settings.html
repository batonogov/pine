<main class="help-topic">
    <nav class="breadcrumbs"><a href="index.html">Pineヘルプ</a></nav>

    <section id="settings">
        <a name="pine-settings" id="pine-settings"></a>
        <h2>設定とキーバインド</h2>
        <div class="feature-grid">
            <div class="card">
                <h3>設定ウィンドウ</h3>
                <p>Cmd+カンマで設定を開きます。エディタの既定値、ターミナル、言語サーバー、エージェントのプライバシーを設定します。</p>
            </div>
            <div class="card">
                <h3>カスタムキーバインド</h3>
                <p>管理されたキーバインドファイルでショートカットを上書きできます。コマンドパレットに有効な割り当てが表示されます。</p>
            </div>
            <div class="card">
                <h3>コマンドパレット</h3>
                <p>VS Codeのように、あいまい検索可能なパレットからコマンドを探して実行できます。</p>
            </div>
            <div class="card">
                <h3>タスク</h3>
                <p>カスタムタスクを定義し、コマンドパレットや「タスク」メニューからシェルコマンド・フォーマッタ・ビルドスクリプトを実行できます。</p>
            </div>
        </div>
    </section>
