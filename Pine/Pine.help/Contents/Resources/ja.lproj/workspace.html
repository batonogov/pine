<body>
<main class="help-topic">
    <nav class="breadcrumbs"><a href="index.html">Pineヘルプ</a></nav>

    <section id="workspace">
        <a name="pine-workspace" id="pine-workspace"></a>
        <h2>エディタ、ペイン、ターミナル</h2>
        <div class="feature-grid">
            <div class="card">
                <h3>プレビューとピン留めタブ</h3>
                <p>サイドバーのファイルをクリックすると一時的なプレビュータブとして開きます。ダブルクリックまたは編集でピン留めできます。</p>
            </div>
            <div class="card">
                <h3>Markdownプレビュー</h3>
                <p>Cmd+Shift+Pで、ソースのみ・レンダリング・並列Markdownプレビューを切り替えます。</p>
            </div>
            <div class="card">
                <h3>安全な保存</h3>
                <p>変更のあるタブは閉じる前に保護されます。自動保存と保存時フォーマットは「ファイル」メニューにあります。</p>
            </div>
            <div class="card">
                <h3>セッションの復元</h3>
                <p>Pineはプロジェクトを再度開いたときに、タブ・ペインレイアウト・カーソル位置を復元します。</p>
            </div>
        </div>
    </section>

    <nav class="topic-footer"><a href="index.html">← Pineヘルプ</a></nav>
