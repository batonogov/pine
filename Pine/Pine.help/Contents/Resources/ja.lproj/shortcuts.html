    <nav class="breadcrumbs"><a href="index.html">Pineヘルプ</a></nav>

    <section id="shortcuts">
        <a name="pine-shortcuts" id="pine-shortcuts"></a>
        <h2>主要なショートカット</h2>
        <div class="shortcut-grid">
            <div class="shortcut"><span>フォルダを開く</span><kbd>⇧⌘O</kbd></div>
            <div class="shortcut"><span>クイックオープン</span><kbd>⌘P</kbd></div>
            <div class="shortcut"><span>検索</span><kbd>⌘F</kbd></div>
            <div class="shortcut"><span>プロジェクト内検索</span><kbd>⇧⌘F</kbd></div>
            <div class="shortcut"><span>検索と置換</span><kbd>⌥⌘F</kbd></div>
            <div class="shortcut"><span>行へ移動</span><kbd>⌘L</kbd></div>
            <div class="shortcut"><span>シンボルへ移動</span><kbd>⌘R</kbd></div>
            <div class="shortcut"><span>保存</span><kbd>⌘S</kbd></div>
            <div class="shortcut"><span>ターミナルの表示切り替え</span><kbd>⌘`</kbd></div>
            <div class="shortcut"><span>新しいターミナルタブ</span><kbd>⌘T</kbd></div>
            <div class="shortcut"><span>Markdownプレビューを切り替え</span><kbd>⇧⌘P</kbd></div>
            <div class="shortcut"><span>Gitブランチ切替</span><kbd>⇧⌘B</kbd></div>
            <div class="shortcut"><span>クイックターミナル</span><kbd>⌃⌥Space</kbd></div>
            <div class="shortcut"><span>コメントの切り替え</span><kbd>⌘/</kbd></div>
            <div class="shortcut"><span>ミニマップ</span><kbd>⇧⌘M</kbd></div>
            <div class="shortcut"><span>折り返し</span><kbd>⌥⌘Z</kbd></div>
            <div class="shortcut"><span>次 / 前の変更</span><kbd>⌃⌥↓/↑</kbd></div>
            <div class="shortcut"><span>次 / 前の診断</span><kbd>⌥⌘↓/↑</kbd></div>
        </div>
        <p class="tip"><strong>ヒント：</strong>メニューにはすべてのコマンドと現在のキーボードショートカットが表示されます。</p>
    </section>
