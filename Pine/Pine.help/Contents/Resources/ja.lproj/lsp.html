    <section id="lsp">
        <a name="pine-lsp" id="pine-lsp"></a>
        <h2>言語サーバーと診断</h2>
        <div class="feature-grid">
            <div class="card">
                <h3>コードインテリジェンス</h3>
                <p>PineはLanguage Server Protocolを利用し、診断・補完・ホバー・定義へ移動・名前変更を提供します。</p>
            </div>
            <div class="card">
                <h3>サーバーの設定</h3>
                <p>「設定」&gt;「言語」を開き、言語ごとにサーバー実行ファイルの有効化・無効化・設定を行います。</p>
            </div>
            <div class="card">
                <h3>問題パネル</h3>
                <p>プロジェクト全体の診断を折りたたみ可能なパネルで確認します。キーボードショートカットでエラーや警告を移動できます。</p>
            </div>
            <div class="card">
                <h3>コードアクション</h3>
                <p>ガターの診断インジケータをクリックするか、メニューからクイック修正やリファクタリングを適用します。</p>
            </div>
        </div>
    </section>
