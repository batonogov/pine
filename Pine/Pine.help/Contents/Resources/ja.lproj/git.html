    <title>Git連携 — Pineヘルプ</title>

<body>
<main class="help-topic">
    <nav class="breadcrumbs"><a href="index.html">Pineヘルプ</a></nav>

    <section id="git">
        <a name="pine-git" id="pine-git"></a>
        <h2>Git連携</h2>
        <div class="feature-grid">
            <div class="card">
                <h3>ファイルステータス</h3>
                <p>サイドバーに変更・追加・削除されたファイルが色付きのステータス表示で示されます。</p>
            </div>
            <div class="card">
                <h3>差分マーカー</h3>
                <p>追加・変更・削除された行が、エディタのガターに色付きマーカーとして表示されます。</p>
            </div>
            <div class="card">
                <h3>ブランチの切り替え</h3>
                <p>タイトルバーのブランチ名をクリックするか、Cmd+Shift+Bでローカルブランチを切り替えます。</p>
            </div>
            <div class="card">
                <h3>Blame表示</h3>
                <p>Blame表示をオンにして、行ごとのコミット情報（ハッシュ・作成者・タイムスタンプ・メッセージ）を確認します。</p>
            </div>
        </div>
    </section>

    <nav class="topic-footer"><a href="index.html">← Pineヘルプ</a></nav>
