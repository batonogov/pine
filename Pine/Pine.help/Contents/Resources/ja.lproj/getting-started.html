    <section id="getting-started">
        <a name="pine-getting-started" id="pine-getting-started"></a>
        <h2>はじめに</h2>
        <div class="steps">
            <div class="card">
                <h3>1. フォルダを開く</h3>
                <p>「ファイル」&gt;「フォルダを開く」を選択し、プロジェクトを含むディレクトリを選びます。</p>
            </div>
            <div class="card">
                <h3>2. ファイルを開く</h3>
                <p>サイドバーでファイルを選ぶか、クイックオープンで名前から探します。</p>
            </div>
            <div class="card">
                <h3>3. ワークスペースを整える</h3>
                <p>タブをエディタの端にドラッグして分割を作るか、別のタブバーにドラッグして移動します。</p>
            </div>
            <div class="card">
                <h3>4. 作業を続ける</h3>
                <p>Pineはプロジェクトのウィンドウ、エディタのタブ、ペインのレイアウトを復元します。</p>
            </div>
        </div>
    </section>
