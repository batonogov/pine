    <section id="shortcuts">
        <a name="pine-shortcuts" id="pine-shortcuts"></a>
        <h2>필수 단축키</h2>
        <div class="shortcut-grid">
            <div class="shortcut"><span>폴더 열기</span><kbd>⇧⌘O</kbd></div>
            <div class="shortcut"><span>빠른 열기</span><kbd>⌘P</kbd></div>
            <div class="shortcut"><span>파일에서 찾기</span><kbd>⌘F</kbd></div>
            <div class="shortcut"><span>프로젝트에서 찾기</span><kbd>⇧⌘F</kbd></div>
            <div class="shortcut"><span>찾기 및 바꾸기</span><kbd>⌥⌘F</kbd></div>
            <div class="shortcut"><span>줄로 이동</span><kbd>⌘L</kbd></div>
            <div class="shortcut"><span>심볼로 이동</span><kbd>⌘R</kbd></div>
            <div class="shortcut"><span>저장</span><kbd>⌘S</kbd></div>
            <div class="shortcut"><span>터미널 켜기/끄기</span><kbd>⌘`</kbd></div>
            <div class="shortcut"><span>새 터미널 탭</span><kbd>⌘T</kbd></div>
            <div class="shortcut"><span>Markdown 미리 보기</span><kbd>⇧⌘P</kbd></div>
            <div class="shortcut"><span>Git 브랜치 전환</span><kbd>⇧⌘B</kbd></div>
            <div class="shortcut"><span>퀵 터미널</span><kbd>⌃⌥Space</kbd></div>
            <div class="shortcut"><span>주석 토글</span><kbd>⌘/</kbd></div>
            <div class="shortcut"><span>미니맵 토글</span><kbd>⇧⌘M</kbd></div>
            <div class="shortcut"><span>다음 / 이전 변경</span><kbd>⌃⌥↓/↑</kbd></div>
        </div>
        <p class="tip"><strong>팁:</strong> 메뉴에 모든 사용 가능한 명령과 현재 키보드 단축키가 표시됩니다.</p>
    </section>
