        <h2>설정과 키바인딩</h2>
        <div class="feature-grid">
            <div class="card">
                <h3>설정 창</h3>
                <p>Cmd+쉼표를 눌러 설정을 엽니다. 편집기 기본값, 터미널, 언어 서버, 에이전트 개인정보 보호를 구성합니다.</p>
            </div>
            <div class="card">
                <h3>사용자 지정 키바인딩</h3>
                <p>관리되는 키바인딩 파일로 키보드 단축키를 재정의합니다. 명령 팔레트에 실제 바인딩이 표시됩니다.</p>
            </div>
            <div class="card">
                <h3>명령 팔레트</h3>
                <p>VS Code와 비슷한 퍼지 검색 팔레트로 명령을 찾고 실행합니다.</p>
            </div>
            <div class="card">
                <h3>작업</h3>
                <p>사용자 지정 작업을 정의해 명령 팔레트나 작업 메뉴에서 셸 명령, 포매터, 빌드 스크립트를 실행합니다.</p>
            </div>
