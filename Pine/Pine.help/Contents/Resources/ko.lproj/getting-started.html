        <h2>시작하기</h2>
        <div class="steps">
            <div class="card">
                <h3>1. 폴더 열기</h3>
                <p>파일 &gt; 폴더 열기를 선택한 뒤 프로젝트가 있는 디렉터리를 고릅니다.</p>
            </div>
            <div class="card">
                <h3>2. 파일 열기</h3>
                <p>사이드바에서 파일을 선택하거나 빠른 열기로 이름으로 찾습니다.</p>
            </div>
            <div class="card">
                <h3>3. 작업 공간 정리</h3>
                <p>탭을 편집기 가장자리로 끌어 분할을 만들거나, 다른 탭 표시줄로 끌어 이동합니다.</p>
            </div>
            <div class="card">
                <h3>4. 계속 작업</h3>
                <p>Pine은 프로젝트 창, 편집기 탭, 패널 레이아웃을 다시 열 때 복원합니다.</p>
            </div>
