        <div class="feature-grid">

                <h3>파일 상태</h3>
                <p>사이드바에 수정·추가·삭제된 파일이 색상 상태 표시로 나타납니다.</p>
            </div>
            <div class="card">
                <h3>Diff 표시</h3>
                <p>추가·수정·삭제된 줄이 편집기 여백에 색상 표시로 나타납니다.</p>
            </div>
            <div class="card">
                <h3>브랜치 전환</h3>
                <p>제목 표시줄의 브랜치 이름을 클릭하거나 Cmd+Shift+B를 눌러 로컬 브랜치 사이를 전환합니다.</p>
            </div>
            <div class="card">
                <h3>Blame 보기</h3>
                <p>Blame 보기를 켜서 줄마다 커밋 정보(해시, 작성자, 시간, 메시지)를 확인합니다.</p>
